<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FC Mobile VN - Siêu Cơ Sở Dữ Liệu Đồ Họa</title>
    <style>
        /* Toàn bộ giao diện được đồng bộ theo tone màu tối và ánh sáng Neon của FC Mobile */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #05070b;
            color: #ffffff;
            line-height: 1.6;
        }

        header {
            background: linear-gradient(180deg, #111723 0%, #090d15 100%);
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #00ff66;
            box-shadow: 0px 4px 20px rgba(0, 255, 102, 0.2);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 26px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.5);
        }

        .logo span {
            color: #00ff66;
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 32px;
            text-transform: uppercase;
            font-weight: 800;
            margin-bottom: 5px;
            color: #ffffff;
        }

        .counter-badge {
            color: #00ff66;
            font-size: 16px;
            margin-bottom: 30px;
            display: block;
            font-weight: 600;
        }

        /* Thanh Tìm Kiếm & Bộ Lọc Hiện Đại */
        .controls-container {
            background: #0f1422;
            padding: 25px;
            border-radius: 16px;
            border: 1px solid #1f2942;
            margin-bottom: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .search-box {
            width: 100%;
            max-width: 600px;
            padding: 15px 25px;
            font-size: 16px;
            border: 2px solid #1f2942;
            border-radius: 30px;
            background-color: #07090e;
            color: white;
            outline: none;
            transition: all 0.3s ease;
            margin-bottom: 20px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        .search-box:focus {
            border-color: #00ff66;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.4);
        }

        .filter-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn-filter {
            background-color: #171f33;
            color: #a0aec0;
            border: 1px solid #23304d;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        .btn-filter:hover, .btn-filter.active {
            background: linear-gradient(135deg, #00ff66 0%, #00993d 100%);
            color: #000000;
            border-color: #00ff66;
            box-shadow: 0 4px 15px rgba(0, 255, 102, 0.4);
            transform: translateY(-2px);
        }

        /* LƯỚI THẺ CẦU THỦ THIẾT KẾ CHUẨN FC MOBILE */
        .player-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 25px;
            min-height: 400px;
        }

        /* Design phôi thẻ cầu thủ hình lục giác độc đáo */
        .player-card {
            background: linear-gradient(135deg, #1a2236 0%, #0e1320 100%);
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            border: 2px solid #283554;
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .player-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: #ffe066;
            box-shadow: 0 15px 30px rgba(255, 224, 102, 0.25);
        }

        /* Badge OVR sáng loáng màu vàng kim loại */
        .ovr-badge {
            background: linear-gradient(135deg, #ffe066 0%, #f5b041 50%, #c0392b 100%);
            color: #000000;
            font-weight: 900;
            padding: 6px 14px;
            border-radius: 6px;
            display: inline-block;
            font-size: 16px;
            letter-spacing: -0.5px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 2;
        }

        .pos-tag {
            position: absolute;
            top: 50px;
            left: 15px;
            font-weight: 800;
            color: #ffe066;
            font-size: 13px;
            z-index: 2;
        }

        /* Khung chứa ảnh chân dung cầu thủ thật từ sân cỏ */
        .player-avatar-container {
            width: 100%;
            height: 140px;
            margin-top: 10px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        .player-img {
            max-width: 110px;
            max-height: 130px;
            object-fit: contain;
            filter: drop-shadow(0px 5px 10px rgba(0,0,0,0.7));
            z-index: 1;
            transition: 0.3s;
        }

        .player-card:hover .player-img {
            transform: scale(1.1);
        }

        /* Nền hiệu ứng hào quang phía sau cầu thủ */
        .card-glow {
            position: absolute;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, rgba(255,224,102,0.2) 0%, rgba(0,0,0,0) 70%);
            top: 20px;
            z-index: 0;
        }

        .player-info-box {
            background: rgba(7, 9, 14, 0.8);
            border-radius: 8px;
            padding: 10px 5px;
            margin-top: 10px;
            border: 1px solid #1d273e;
            position: relative;
            z-index: 2;
        }

        .player-name {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-team {
            color: #8a99ad;
            font-size: 12px;
            font-weight: 500;
        }

        /* Thanh Điều Hướng Phân Trang */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 50px;
        }

        .btn-page {
            background: #121826;
            color: #ffffff;
            border: 1px solid #23304d;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.2s;
            text-transform: uppercase;
            font-size: 13px;
        }

        .btn-page:hover:not(:disabled) {
            background: #00ff66;
            color: #000000;
            box-shadow: 0 0 15px rgba(0,255,102,0.4);
        }

        .btn-page:disabled {
            opacity: 0.2;
            cursor: not-allowed;
        }

        #pageInfo {
            font-weight: 700;
            color: #8a99ad;
            font-size: 15px;
        }

        footer {
            background-color: #030508;
            text-align: center;
            padding: 25px;
            color: #4a5568;
            font-size: 13px;
            border-top: 1px solid #121826;
            margin-top: 80px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">FC<span>MOBILE</span> GRAPHIC DB</div>
    </header>

    <div class="container">
        <h1 class="section-title">Hệ Thống Tra Cứu Cầu Thủ Chuyên Nghiệp</h1>
        <span class="counter-badge" id="totalCounter">Đang kết nối dữ liệu đồ họa...</span>

        <!-- Khung Tìm Kiếm và Lọc -->
        <div class="controls-container">
            <input type="text" id="searchInput" class="search-box" placeholder="Tìm kiếm nhanh tên siêu sao (Messi, Ronaldo, Mbappe...)" oninput="handleSearch()">
            
            <div class="filter-buttons">
                <button class="btn-filter active" onclick="handleFilter('ALL', this)">Tất Cả</button>
                <button class="btn-filter" onclick="handleFilter('FW', this)">Tiền Đạo (FW)</button>
                <button class="btn-filter" onclick="handleFilter('MF', this)">Tiền Vệ (MF)</button>
                <button class="btn-filter" onclick="handleFilter('DF', this)">Hậu Vệ (DF)</button>
                <button class="btn-filter" onclick="handleFilter('GK', this)">Thủ Môn (GK)</button>
            </div>
        </div>

        <!-- Lưới Chứa Thẻ Cầu Thủ Đồ Họa Thực Tế -->
        <div class="player-grid" id="playerGrid"></div>

        <!-- Điều Hướng Trang -->
        <div class="pagination">
            <button class="btn-page" id="btnPrev" onclick="changePage(-1)">◀ TRANG TRƯỚC</button>
            <span id="pageInfo">Trang 1 / 50</span>
            <button class="btn-page" id="btnNext" onclick="changePage(1)">TRANG SAU ▶</button>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 FC Mobile Đồ họa hóa bởi AI Assistant. Hình ảnh bản quyền gốc thuộc EA Sports.</p>
    </footer>
