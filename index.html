<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FC Mobile VN - Sửa Lỗi Tương Tác GitHub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #05070b;
            color: #ffffff;
            line-height: 1.6;
        }

        header {
            background: linear-gradient(180deg, #111723 0%, #090d15 100%);
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #00ff66;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            text-transform: uppercase;
        }

        .logo span {
            color: #00ff66;
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 30px;
            text-transform: uppercase;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .counter-badge {
            color: #00ff66;
            font-size: 16px;
            margin-bottom: 30px;
            display: block;
            font-weight: 600;
        }

        .controls-container {
            background: #0f1422;
            padding: 20px;
            border-radius: 16px;
            border: 1px solid #1f2942;
            margin-bottom: 40px;
            text-align: center;
        }

        .search-box {
            width: 100%;
            max-width: 600px;
            padding: 15px 25px;
            font-size: 16px;
            border: 2px solid #1f2942;
            border-radius: 30px;
            background-color: #07090e;
            color: white;
            outline: none;
            transition: 0.3s;
            margin-bottom: 20px;
            display: inline-block;
        }

        .search-box:focus {
            border-color: #00ff66;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.4);
        }

        .filter-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn-filter {
            background-color: #171f33;
            color: #a0aec0;
            border: 1px solid #23304d;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            text-transform: uppercase;
        }

        .btn-filter:hover, .btn-filter.active {
            background: #00ff66;
            color: #000000;
            border-color: #00ff66;
            box-shadow: 0 4px 15px rgba(0, 255, 102, 0.4);
        }

        .player-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 25px;
            min-height: 400px;
        }

        .player-card {
            background: linear-gradient(135deg, #1a2236 0%, #0e1320 100%);
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            border: 2px solid #283554;
            position: relative;
            overflow: hidden;
            transition: 0.3s;
            cursor: pointer;
        }

        .player-card:hover {
            transform: translateY(-8px);
            border-color: #ffe066;
            box-shadow: 0 15px 30px rgba(255, 224, 102, 0.2);
        }

        .ovr-badge {
            background: linear-gradient(135deg, #ffe066 0%, #f5b041 100%);
            color: #000000;
            font-weight: 900;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 15px;
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 2;
        }

        .pos-tag {
            position: absolute;
            top: 48px;
            left: 15px;
            font-weight: 800;
            color: #ffe066;
            font-size: 13px;
            z-index: 2;
        }

        .player-avatar-container {
            width: 100%;
            height: 130px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            margin-top: 15px;
        }

        .player-img {
            max-width: 100px;
            max-height: 120px;
            object-fit: cover;
            border-radius: 50%; /* Bo tròn ảnh cầu thủ cho đẹp mắt */
            border: 2px solid #283554;
        }

        .player-info-box {
            background: rgba(7, 9, 14, 0.8);
            border-radius: 8px;
            padding: 10px 5px;
            margin-top: 15px;
            border: 1px solid #1d273e;
        }

        .player-name {
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-team {
            color: #8a99ad;
            font-size: 12px;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 50px;
        }

        .btn-page {
            background: #121826;
            color: #ffffff;
            border: 1px solid #23304d;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
        }

        .btn-page:hover:not(:disabled) {
            background: #00ff66;
            color: #000000;
        }

        .btn-page:disabled {
            opacity: 0.2;
            cursor: not-allowed;
        }

        #pageInfo {
            font-weight: 700;
            color: #8a99ad;
        }

        footer {
            background-color: #030508;
            text-align: center;
            padding: 25px;
            color: #4a5568;
            font-size: 13px;
            border-top: 1px solid #121826;
            margin-top: 80px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="section-title">Hệ Thống Tra Cứu 1.000 Cầu Thủ</h1>
        <span class="counter-badge" id="totalCounter">Đang đồng bộ dữ liệu...</span>

        <div class="controls-container">

            <div class="filter-buttons">

                <button class="btn-filter" onclick="handleFilter('MF', this)">Tiền Vệ (MF)</button>
                <button class="btn-filter" onclick="handleFilter('DF', this)">Hậu Vệ (DF)</button>
                <button class="btn-filter" onclick="handleFilter('GK', this)">Thủ Môn (GK)</button>
            </div>
        </div>

        <div class="player-grid" id="playerGrid"></div>

        <div class="pagination">
            <button class="btn-page" id="btnPrev" onclick="changePage(-1)">◀ TRANG TRƯỚC</button>
            <span id="pageInfo">Trang 1 / 50</span>
            <button class="btn-page" id="btnNext" onclick="changePage(1)">TRANG SAU ▶</button>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 FC Mobile Database Live.</p>
    </footer>
