<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FC Mobile Siêu Cơ Sở Dữ Liệu 2500 Cầu Thủ</title>
    <style>
        /* ==========================================
           1. CORE INTERFACE STYLES (FC MOBILE THEME)
           ========================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #04060a;
            color: #ffffff;
            line-height: 1.6;
            overflow-x: hidden;
        }

        header {
            background: linear-gradient(180deg, #0e1420 0%, #06090e 100%);
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #00ff66;
            box-shadow: 0 5px 25px rgba(0, 255, 102, 0.15);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 26px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.3);
        }

        .logo span {
            color: #00ff66;
        }

        .container {
            max-width: 1300px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 32px;
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 5px;
        }

        .counter-badge {
            color: #00ff66;
            font-size: 16px;
            margin-bottom: 30px;
            display: block;
            font-weight: 600;
        }

        /* ==========================================
           2. CONTROLS & FILTER PANELS
           ========================================== */
        .controls-container {
            background: #0b0f19;
            padding: 30px;
            border-radius: 16px;
            border: 1px solid #1a243a;
            margin-bottom: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        .search-box {
            width: 100%;
            max-width: 650px;
            padding: 16px 28px;
            font-size: 16px;
            border: 2px solid #1a243a;
            border-radius: 30px;
            background-color: #05070b;
            color: white;
            outline: none;
            transition: all 0.3s ease;
            margin-bottom: 25px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        .search-box:focus {
            border-color: #00ff66;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.3);
        }

        .filter-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn-filter {
            background-color: #131a2b;
            color: #a0aec0;
            border: 1px solid #1f2a45;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 13px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .btn-filter:hover, .btn-filter.active {
            background: linear-gradient(135deg, #00ff66 0%, #00b347 100%);
            color: #000000;
            border-color: #00ff66;
            box-shadow: 0 5px 15px rgba(0, 255, 102, 0.4);
            transform: translateY(-2px);
        }

        /* ==========================================
           3. ADVANCED CARD ENGINE (FC MOBILE HEXAGON)
           ========================================== */
        .player-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 30px;
            min-height: 500px;
        }

        .player-card {
            background: linear-gradient(135deg, #151d2f 0%, #0a0e17 100%);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            border: 2px solid #222f4c;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }

        .player-card:hover {
            transform: translateY(-10px) scale(1.03);
            border-color: #ffe066;
            box-shadow: 0 20px 40px rgba(255, 224, 102, 0.2);
        }

        .ovr-badge {
            background: linear-gradient(135deg, #ffe066 0%, #f39c12 100%);
            color: #000000;
            font-weight: 950;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 18px;
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 2;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .pos-tag {
            position: absolute;
            top: 58px;
            left: 23px;
            font-weight: 800;
            color: #ffe066;
            font-size: 14px;
            z-index: 2;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .player-avatar-container {
            width: 100%;
            height: 140px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            margin-top: 10px;
            position: relative;
        }

        .player-img {
            max-width: 110px;
            max-height: 130px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #222f4c;
            background-color: #0b111c;
            z-index: 1;
            transition: transform 0.3s ease;
        }

        .player-card:hover .player-img {
            transform: scale(1.08);
            border-color: #ffe066;
        }

        .player-info-box {
            background: rgba(5, 7, 11, 0.9);
            border-radius: 12px;
            padding: 12px 10px;
            margin-top: 15px;
            border: 1px solid #1a253d;
        }

        .player-name {
            font-size: 17px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-team {
            color: #8c9baf;
            font-size: 13px;
            font-weight: 600;
        }

        /* ==========================================
           4. SYSTEM IN-DEPTH STATS GRID
           ========================================== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 12px;
            border-top: 1px dashed #1a253d;
            padding-top: 12px;
            font-size: 12px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #0d1321;
            padding: 4px;
            border-radius: 6px;
        }

        .stat-lbl {
            color: #64748b;
            font-weight: 600;
            font-size: 10px;
            text-transform: uppercase;
        }

        .stat-val {
            color: #00ff66;
            font-weight: 700;
        }

        /* ==========================================
           5. PACING & PAGINATION ENGINE
           ========================================== */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 60px;
        }

        .btn-page {
            background: #0b0f19;
            color: #ffffff;
            border: 1px solid #1a243a;
            padding: 14px 28px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
        }

        .btn-page:hover:not(:disabled) {
            background: #00ff66;
            color: #000000;
            box-shadow: 0 0 20px rgba(0,255,102,0.4);
        }

        .btn-page:disabled {
            opacity: 0.15;
            cursor: not-allowed;
        }

        #pageInfo {
            font-weight: 800;
            color: #8c9baf;
            font-size: 16px;
        }

        footer {
            background-color: #020305;
            text-align: center;
            padding: 30px;
            color: #475569;
            font-size: 13px;
            border-top: 1px solid #0b0f19;
            margin-top: 100px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">FC<span>MOBILE</span> ULTRA REGISTRY</div>
    </header>

    <div class="container">
        <h1 class="section-title">Hệ Thống Dữ Liệu Tối Cao FC Mobile</h1>
        <span class="counter-badge" id="totalCounter">Đang đồng bộ mạng lưới cơ sở dữ liệu vật lý...</span>

        <!-- Bảng điều khiển truy vấn -->
        <div class="controls-container">
            <input type="text" id="searchInput" class="search-box" placeholder="Nhập tên cầu thủ hoặc câu lạc bộ cần truy xuất..." oninput="handleSearch()">
            
            <div class="filter-buttons">
                <button class="btn-filter active" onclick="handleFilter('ALL', this)">Mọi Vị Trí</button>
                <button class="btn-filter" onclick="handleFilter('FW', this)">Tiền Đạo (FW)</button>
                <button class="btn-filter" onclick="handleFilter('MF', this)">Tiền Vệ (MF)</button>
                <button class="btn-filter" onclick="handleFilter('DF', this)">Hậu Vệ (DF)</button>
