<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FC Mobile VN - Siêu Cơ Sở Dữ Liệu 1000 Cầu Thủ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0e14;
            color: #ffffff;
            line-height: 1.6;
        }

        header {
            background-color: #121824;
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #00ff66;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .logo span {
            color: #00ff66;
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 28px;
            text-transform: uppercase;
            margin-bottom: 10px;
            border-left: 5px solid #00ff66;
            padding-left: 10px;
        }

        .counter-badge {
            color: #00ff66;
            font-size: 16px;
            margin-bottom: 20px;
            display: block;
        }

        /* Khung bộ lọc và tìm kiếm */
        .controls-container {
            background-color: #121824;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #2d384e;
            margin-bottom: 30px;
            text-align: center;
        }

        .search-box {
            width: 100%;
            max-width: 500px;
            padding: 12px 20px;
            font-size: 16px;
            border: 2px solid #2d384e;
            border-radius: 25px;
            background-color: #0b0e14;
            color: white;
            outline: none;
            transition: 0.3s;
            margin-bottom: 15px;
        }

        .search-box:focus {
            border-color: #00ff66;
        }

        .filter-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-filter {
            background-color: #1c2436;
            color: white;
            border: 1px solid #2d384e;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-filter:hover, .btn-filter.active {
            background-color: #00ff66;
            color: black;
            border-color: #00ff66;
        }

        /* Lưới cầu thủ */
        .player-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            min-height: 400px;
        }

        .player-card {
            background-color: #1c2436;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            border: 1px solid #2d384e;
            transition: 0.3s;
            cursor: pointer;
        }

        .player-card:hover {
            transform: translateY(-5px);
            border-color: #00ff66;
            box-shadow: 0 5px 15px rgba(0, 255, 102, 0.2);
        }

        .ovr-badge {
            background: linear-gradient(135deg, #ffe066, #f5b041);
            color: #000;
            font-weight: bold;
            padding: 5px 12px;
            border-radius: 5px;
            display: inline-block;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .player-avatar {
            width: 90px;
            height: 90px;
            background-color: #2d384e;
            border-radius: 50%;
            margin: 10px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            border: 2px solid #3b4a66;
        }

        .player-name {
            font-size: 18px;
            font-weight: bold;
            margin: 10px 0 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-pos {
            color: #aaaaaa;
            font-size: 14px;
        }

        /* Thanh điều hướng phân trang (Pagination) */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 40px;
        }

        .btn-page {
            background-color: #121824;
            color: white;
            border: 1px solid #2d384e;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn-page:hover:not(:disabled) {
            background-color: #00ff66;
            color: black;
        }

        .btn-page:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        #pageInfo {
            font-weight: bold;
            color: #aaaaaa;
        }

        footer {
            background-color: #070a0f;
            text-align: center;
            padding: 20px;
            color: #666666;
            font-size: 14px;
            border-top: 1px solid #1c2436;
            margin-top: 60px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">FC<span>MOBILE</span> MEGA DB</div>
    </header>

    <div class="container">
        <h2 class="section-title">Hệ Thống Tra Cứu 1.000 Cầu Thủ</h2>
        <span class="counter-badge" id="totalCounter">Đang tải danh sách...</span>

        <!-- Bộ điều khiển tìm kiếm -->
        <div class="controls-container">
            <input type="text" id="searchInput" class="search-box" placeholder="Tìm kiếm nhanh theo tên cầu thủ..." oninput="handleSearch()">
            
            <div class="filter-buttons">
                <button class="btn-filter active" onclick="handleFilter('ALL', this)">Tất Cả</button>
                <button class="btn-filter" onclick="handleFilter('FW', this)">Tiền Đạo (FW)</button>
                <button class="btn-filter" onclick="handleFilter('MF', this)">Tiền Vệ (MF)</button>
                <button class="btn-filter" onclick="handleFilter('DF', this)">Hậu Vệ (DF)</button>
                <button class="btn-filter" onclick="handleFilter('GK', this)">Thủ Môn (GK)</button>
            </div>
        </div>

        <!-- Lưới hiển thị cầu thủ (Được nạp tự động bằng JS) -->
        <div class="player-grid" id="playerGrid"></div>

        <!-- Thanh phân trang -->
        <div class="pagination">
            <button class="btn-page" id="btnPrev" onclick="changePage(-1)">◀ Trang trước</button>
            <span id="pageInfo">Trang 1 / 50</span>
            <button class="btn-page" id="btnNext" onclick="changePage(1)">Trang sau ▶</button>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 FC Mobile VN Mega Database System.</p>
    </footer>

    <script>
